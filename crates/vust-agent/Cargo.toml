[package]
name = "vust-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
vust-api = { workspace = true }
vust-contracts = { workspace = true }
vust-security = { workspace = true }
vust-upgrade = { workspace = true }

axum = { workspace = true, features = ["multipart", "json", "tracing", "ws"] }
axum-server = { workspace = true, features = ["tls-rustls"] }
tower-http = { workspace = true, features = ["trace", "cors", "limit", "timeout"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "chrono", "json"] }
tracing-appender = { workspace = true }
tokio = { workspace = true, features = ["full"] }
bollard = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
semver = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7"] }
chrono = { workspace = true, features = ["serde"] }
chrono-tz = { workspace = true }
sha2 = { workspace = true }
cron = { workspace = true }
libc = { workspace = true }
xattr = { workspace = true }
once_cell = "1.18"
futures-util = { workspace = true }
ring = { workspace = true }
hex = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
bytes = "1"
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream", "multipart"] }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
toml = { workspace = true }
sysinfo = { workspace = true }
dotenvy = { workspace = true }
dirs = "6.0.0"
clap = { workspace = true, features = ["derive"] }
shadow-rs = { workspace = true, features = ["metadata"] }

[build-dependencies]
anyhow = { workspace = true }
shadow-rs = { workspace = true }
