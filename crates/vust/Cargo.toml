[package]
name = "vust"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
vust-api = { workspace = true }
vust-contracts = { workspace = true }
vust-security = { workspace = true }
vust-upgrade = { workspace = true }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
semver = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
chrono-tz = { workspace = true }
sha2 = { workspace = true }
axum = { workspace = true, features = ["multipart", "json", "tracing", "ws"] }
axum-server = { workspace = true, features = ["tls-rustls"] }
axum-extra = { workspace = true, features = ["typed-header", "cookie"] }
tower-http = { workspace = true, features = ["trace", "cors", "limit", "timeout"] }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["io"] }
tokio-stream = { workspace = true }
bcrypt = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "chrono", "json"] }
tracing-appender = { workspace = true }
shadow-rs = { workspace = true, features = ["metadata"] }
anyhow = { workspace = true }
bollard = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "json"] }
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream", "multipart"] }
reqwest-websocket = { workspace = true }
futures-util = { workspace = true }
rustls = { workspace = true }
ring = { workspace = true }
hex = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
prost = { version = "0.13", features = ["derive"] }
base64 = { workspace = true }
png = { workspace = true }
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
toml = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7"] }
cron = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }
cookie = { workspace = true }
clap = { workspace = true, features = ["derive"] }
dotenvy = { workspace = true }
captcha-rs = "0.5.0"


[build-dependencies]
anyhow = { workspace = true }
shadow-rs = { workspace = true }
