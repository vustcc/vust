<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" role="img" aria-labelledby="title desc">
  <title id="title">VUST desktop wallpaper (Light)</title>
  <desc id="desc">Minimal vector desktop wallpaper for a distributed security laboratory platform in light theme.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F7FB"/>
      <stop offset="0.52" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2EBF8"/>
    </linearGradient>
    <radialGradient id="northGlow" cx="50%" cy="18%" r="62%">
      <stop offset="0" stop-color="#1D63ED" stop-opacity="0.08"/>
      <stop offset="0.42" stop-color="#00D4B4" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="edgeGlow" cx="20%" cy="74%" r="52%">
      <stop offset="0" stop-color="#1D63ED" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#7C6CFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1D63ED" stop-opacity="0"/>
