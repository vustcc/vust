      <stop offset="0.52" stop-color="#00D4B4" stop-opacity="0.54"/>
      <stop offset="1" stop-color="#00D4B4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="purpleLine" x1="0" y1="1" x2="1" y2="0">
