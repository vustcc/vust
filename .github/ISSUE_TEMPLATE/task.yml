name: 开发任务
description: 记录维护、重构、测试、文档等明确任务
title: "[Task] "
labels:
  - task
body:
  - type: textarea
    id: goal
    attributes:
      label: 任务目标
      description: 说明这项任务要达成什么结果。
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: 任务类型
      options:
        - 维护
        - 重构
        - 测试
        - 文档
        - 构建/发布
        - 安全加固
        - 其他
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: 补充说明
      description: 记录范围、验收标准、依赖、风险或相关链接。
    validations:
      required: false
